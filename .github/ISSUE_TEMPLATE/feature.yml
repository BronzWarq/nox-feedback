name: "💡 Предложение"
description: Предложить функцию или улучшение Nox
title: "[Предложение]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Раздел
      options:
        - Telegram
        - Twitch
        - Nox Games
        - Nox Cards
        - База и Нокси
        - Nox Live
        - Другое
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает предложение
      description: Опишите ситуацию, в которой текущего поведения недостаточно.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Дополнительные примеры или макеты

